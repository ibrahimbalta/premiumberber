<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi | Premium Barber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div style="margin-bottom: 28px;">
            <i class="fas fa-scissors" style="font-size: 2rem; color: var(--primary-gold); margin-bottom: 16px;"></i>
        </div>
        <h2>YÖNETİCİ GİRİŞİ</h2>
        <form class="login-form" id="loginForm">
            <input type="text" id="username" placeholder="Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
        </form>
        <p id="errorMsg" style="color: #FF6B6B; margin-top: 18px; display: none; font-size: 0.85rem;"><i class="fas fa-exclamation-circle"></i> Hatalı kullanıcı adı veya şifre!</p>
        <a href="index.html" style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; text-decoration: none; font-size: 0.85rem; transition: color 0.3s;">
            <i class="fas fa-arrow-left"></i> Siteye Dön
        </a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === 'sedat74') {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                const errMsg = document.getElementById('errorMsg');
                errMsg.style.display = 'block';
                errMsg.style.animation = 'fadeInUp 0.3s ease';
            }
        });
    </script>
</body>
</html>
